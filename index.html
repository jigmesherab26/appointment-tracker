<!DOCTYPE html>
<html>
<head>
    <title>Appointments Reminder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Appointment List</h1>
        <div class="input-group">
            <input id="title" type="text" placeholder="Appointment Title">
            <label for="date">Date: </label>
            <label for="time">Time: </label>
            <input id="date" type="date" placeholder="mm/dd/yyyy">
            <input id="time" type="time" placeholder="--:-- --">
            <button id="add-btn">ADD APPOINTMENT</button>
        </div>
        <ul id="appointmentList"></ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
